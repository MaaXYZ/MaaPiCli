name: test

on:
    push:
        branches:
            - main
        paths:
            - '.github/workflows/test.yml'
            - '.github/workflows/meta.yml'
            - '.github/actions/setup-maafw/**'
            - 'CLI/**'
            - 'Impl/**'
            - 'include/**'
            - 'maafw-version.txt'
            - 'test/package/maapicli/**'
            - 'test/parser/**'
            - 'test/cli/**'
            - 'cmake/**'
            - 'CMakeLists.txt'
    pull_request:
        paths:
            - '.github/workflows/test.yml'
            - '.github/workflows/meta.yml'
            - '.github/actions/setup-maafw/**'
            - 'CLI/**'
            - 'Impl/**'
            - 'include/**'
            - 'maafw-version.txt'
            - 'test/package/maapicli/**'
            - 'test/parser/**'
            - 'test/cli/**'
            - 'cmake/**'
            - 'CMakeLists.txt'
    workflow_dispatch:
        inputs:
            maaframework-repository:
                description: MaaFramework repository
                required: true
                default: MaaXYZ/MaaFramework
                type: string
            maaframework-version:
                description: MaaFramework release tag override
                required: false
                default: ''
                type: string

permissions:
    contents: read
    actions: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
    cancel-in-progress: true

jobs:
    meta:
        uses: ./.github/workflows/meta.yml
        with:
            build-config: Debug
            maaframework-version: ${{ inputs.maaframework-version || '' }}

    package:
        needs: meta
        name: ${{ matrix.os }} ${{ matrix.arch }}
        runs-on: ${{ matrix.runs-on }}
        strategy:
            fail-fast: false
            # The Windows runtime is a release build. MSVC Debug STL is ABI-incompatible
            # with it, so Windows package consumers must use a release-compatible config.
            matrix:
                include:
                    - os: windows
                      runs-on: windows-2025-vs2026
                      arch: x86_64
                      platform: x64
                      build-config: RelWithDebInfo
                    - os: linux
                      runs-on: ubuntu-latest
                      arch: x86_64
                      platform: x86_64
                      build-config: Debug
                    - os: macos
                      runs-on: macos-15
                      arch: aarch64
                      platform: arm64
                      build-config: Debug

        steps:
            - uses: actions/checkout@v7

            - name: Configure macOS test keychain
              if: runner.os == 'macOS'
              shell: bash
              run: |
                  keychain_path="$RUNNER_TEMP/maapicli-test.keychain-db"
                  keychain_password="$(openssl rand -hex 32)"

                  security create-keychain -p "$keychain_password" "$keychain_path"
                  security set-keychain-settings -lut 21600 "$keychain_path"
                  security unlock-keychain -p "$keychain_password" "$keychain_path"
                  security default-keychain -d user -s "$keychain_path"

            - name: Setup precompiled MaaFramework
              id: setup-maafw
              uses: ./.github/actions/setup-maafw
              with:
                  repository: ${{ inputs.maaframework-repository || 'MaaXYZ/MaaFramework' }}
                  version: ${{ needs.meta.outputs.maaframework-version }}
                  arch: ${{ matrix.arch }}

            - name: Build package
              shell: bash
              run: |
                  build_config="${{ matrix.build-config }}"
                  cmake_args=(
                    -S .
                    -B build-maapicli
                    -DCMAKE_PREFIX_PATH="${{ steps.setup-maafw.outputs.install-prefix }};${{ steps.setup-maafw.outputs.dependency-prefix }}"
                    -DCMAKE_BUILD_TYPE="$build_config"
                    -DMaaPiCli_BUILD_TESTS=ON
                  )

                  if [[ "${{ runner.os }}" == "Windows" ]]; then
                      cmake_args+=(-A "${{ matrix.platform }}" -DCMAKE_SYSTEM_VERSION="10.0.26100.0")
                  elif [[ "${{ runner.os }}" == "Linux" ]]; then
                      openssl_prefix="${{ steps.setup-maafw.outputs.openssl-prefix }}"
                      cmake_args+=(
                        -DCMAKE_TOOLCHAIN_FILE="${{ steps.setup-maafw.outputs.toolchain-file }}"
                        -DOPENSSL_INCLUDE_DIR="$openssl_prefix/include"
                        -DOPENSSL_CRYPTO_LIBRARY="$openssl_prefix/lib/libcrypto.a"
                        -DOPENSSL_USE_STATIC_LIBS=ON
                      )
                  else
                      cmake_args+=(-DCMAKE_OSX_SYSROOT=macosx -DCMAKE_OSX_ARCHITECTURES="${{ matrix.platform }}")
                  fi

                  cmake "${cmake_args[@]}"
                  cmake --build build-maapicli --config "$build_config" -j 16
                  cmake --install build-maapicli --prefix "$PWD/install-maapicli" --config "$build_config"

            - name: Test parser
              shell: bash
              run: |
                  build_config="${{ matrix.build-config }}"
                  framework_prefix="${{ steps.setup-maafw.outputs.install-prefix }}"

                  if [[ "${{ runner.os }}" == "Windows" ]]; then
                      framework_prefix=$(cygpath -u "$framework_prefix")
                  fi

                  export PATH="$framework_prefix/bin:$PATH"
                  ctest --test-dir build-maapicli -C "$build_config" --output-on-failure --timeout 60

            - name: Test installed package
              shell: bash
              run: |
                  build_config="${{ matrix.build-config }}"
                  framework_prefix="${{ steps.setup-maafw.outputs.install-prefix }}"
                  maapicli_prefix="$PWD/install-maapicli"

                  if [[ "${{ runner.os }}" == "Windows" ]]; then
                      framework_prefix=$(cygpath -u "$framework_prefix")
                      maapicli_prefix=$(cygpath -m "$maapicli_prefix")
                  fi

                  export PATH="$framework_prefix/bin:$PATH"

                  package_args=(
                    -S test/package/maapicli
                    -B build-package-test
                    -DCMAKE_PREFIX_PATH="$maapicli_prefix;${{ steps.setup-maafw.outputs.install-prefix }};${{ steps.setup-maafw.outputs.dependency-prefix }}"
                    -DMaaPiCli_DIR="$maapicli_prefix/share/cmake/MaaPiCli"
                    -DCMAKE_BUILD_TYPE="$build_config"
                  )
                  if [[ "${{ runner.os }}" == "macOS" ]]; then
                      package_args+=(-DCMAKE_OSX_ARCHITECTURES="${{ matrix.platform }}")
                  fi
                  if [[ "${{ runner.os }}" == "Linux" ]]; then
                      openssl_prefix="${{ steps.setup-maafw.outputs.openssl-prefix }}"
                      package_args+=(
                        -DCMAKE_TOOLCHAIN_FILE="${{ steps.setup-maafw.outputs.toolchain-file }}"
                        -DOPENSSL_INCLUDE_DIR="$openssl_prefix/include"
                        -DOPENSSL_CRYPTO_LIBRARY="$openssl_prefix/lib/libcrypto.a"
                        -DOPENSSL_USE_STATIC_LIBS=ON
                      )
                  fi
                  if [[ "${{ runner.os }}" == "Windows" ]]; then
                      package_args+=(-A x64)
                  fi

                  cmake "${package_args[@]}"
                  cmake --build build-package-test --config "$build_config" -j 16
                  ctest --test-dir build-package-test -C "$build_config" --output-on-failure --timeout 60
